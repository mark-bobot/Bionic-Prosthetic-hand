<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1040" viewBox="0 0 1500 1040">
<rect width="1500" height="1040" fill="#f8fafc"/>
<style>text{font-family:Arial,sans-serif;fill:#182b3a} .small{font-size:17px}.label{font-size:20px}.title{font-size:30px;font-weight:bold}</style>
<text x="40" y="45" font-size="30">Phoenix v3 • three-servo EMG wiring</text>
<text x="40" y="77" font-size="19">Classic 5 V Nano / SEN0240 / reference 5 V servo supply — proposed bench wiring</text>
<rect x="40" y="115" width="290" height="135" rx="9" fill="white" stroke="#54758a" stroke-width="2"/>
<text x="54" y="145" font-size="22">2S protected battery</text>
<text x="54" y="174" font-size="17">7.4 V nominal / 8.4 V full</text>
<text x="54" y="198" font-size="17">1,000 mAh, ≥10 A discharge</text>
<text x="54" y="222" font-size="17">Charge disconnected from device</text>
<rect x="390" y="115" width="270" height="135" rx="9" fill="white" stroke="#54758a" stroke-width="2"/>
<text x="404" y="145" font-size="22">Input protection</text>
<text x="404" y="174" font-size="17">+ → 7.5 A fuse → DC switch</text>
<text x="404" y="198" font-size="17">Switch rated ≥10 A DC</text>
<text x="404" y="222" font-size="17">GND → star return below</text>
<polyline points="330,160 390,160" fill="none" stroke="#d44540" stroke-width="3"/>
<text x="339" y="148" font-size="18">+</text>
<rect x="730" y="115" width="310" height="135" rx="9" fill="white" stroke="#54758a" stroke-width="2"/>
<text x="744" y="145" font-size="22">Servo regulator</text>
<text x="744" y="174" font-size="17">Pololu D24V90F5</text>
<text x="744" y="198" font-size="17">VIN = switched battery</text>
<text x="744" y="222" font-size="17">VOUT = 5 V servo rail</text>
<rect x="730" y="290" width="310" height="135" rx="9" fill="white" stroke="#54758a" stroke-width="2"/>
<text x="744" y="320" font-size="22">Logic regulator</text>
<text x="744" y="349" font-size="17">Pololu D24V5F5</text>
<text x="744" y="373" font-size="17">VIN = switched battery</text>
<text x="744" y="397" font-size="17">VOUT = 5 V logic rail</text>
<polyline points="660,160 730,160" fill="none" stroke="#d44540" stroke-width="3"/>
<polyline points="695,160 695,335 730,335" fill="none" stroke="#d44540" stroke-width="3"/>
<rect x="1110" y="115" width="345" height="170" rx="9" fill="white" stroke="#54758a" stroke-width="2"/>
<text x="1124" y="145" font-size="22">Servo power distribution</text>
<text x="1124" y="174" font-size="17">5 V → all three red / + wires</text>
<text x="1124" y="198" font-size="17">GND → all three return wires</text>
<text x="1124" y="222" font-size="17">1,000 µF / 10 V across rail</text>
<text x="1124" y="246" font-size="17">Do not carry this current via Nano</text>
<polyline points="1040,160 1110,160" fill="none" stroke="#d44540" stroke-width="3"/>
<rect x="380" y="490" width="320" height="265" rx="9" fill="white" stroke="#54758a" stroke-width="2"/>
<text x="394" y="520" font-size="22">Arduino Nano (classic)</text>
<text x="394" y="549" font-size="17">5V ← logic regulator (not VIN)</text>
<text x="394" y="573" font-size="17">GND → common star return</text>
<text x="394" y="597" font-size="17">A0 ← EMG analogue output</text>
<text x="394" y="621" font-size="17">D2 → ARM switch → GND</text>
<text x="394" y="645" font-size="17">D9 → thumb signal</text>
<text x="394" y="669" font-size="17">D10 → index + middle signal</text>
<text x="394" y="693" font-size="17">D11 → ring + little signal</text>
<rect x="40" y="490" width="285" height="200" rx="9" fill="white" stroke="#54758a" stroke-width="2"/>
<text x="54" y="520" font-size="22">DFRobot SEN0240</text>
<text x="54" y="549" font-size="17">+ ← clean logic 5 V</text>
<text x="54" y="573" font-size="17">− → signal ground</text>
<text x="54" y="597" font-size="17">A → Nano A0</text>
<text x="54" y="621" font-size="17">PJ-342 → dry-electrode board</text>
<text x="54" y="645" font-size="17">22 × 35 mm signal board</text>
<polyline points="1040,335 1070,335 1070,460 190,460 190,490" fill="none" stroke="#d44540" stroke-width="3"/>
<polyline points="540,460 540,490" fill="none" stroke="#d44540" stroke-width="3"/>
<text x="725" y="448" font-size="18">5 V LOGIC / SENSOR</text>
<polyline points="325,585 380,585" fill="none" stroke="#0d8c94" stroke-width="3"/>
<text x="331" y="574" font-size="16">A0</text>
<rect x="40" y="290" width="590" height="130" rx="9" fill="white" stroke="#54758a" stroke-width="2"/>
<text x="54" y="320" font-size="22">Small parts</text>
<text x="54" y="349" font-size="17">A0 to GND: 1 MΩ resistor (unplugged-signal bias).</text>
<text x="54" y="373" font-size="17">SEN0240 + to −: 100 nF ceramic + 10 µF electrolytic.</text>
<text x="54" y="397" font-size="17">Observe electrolytic capacitor polarity.</text>
<rect x="1110" y="420" width="345" height="105" rx="9" fill="white" stroke="#54758a" stroke-width="2"/>
<text x="1124" y="450" font-size="22">Servo 1 • thumb</text>
<text x="1124" y="479" font-size="17">D9 → signal (220 Ω series)</text>
<text x="1124" y="503" font-size="17">5 V + GND from distribution</text>
<rect x="1110" y="555" width="345" height="105" rx="9" fill="white" stroke="#54758a" stroke-width="2"/>
<text x="1124" y="585" font-size="22">Servo 2 • index + middle</text>
<text x="1124" y="614" font-size="17">D10 → signal (220 Ω series)</text>
<text x="1124" y="638" font-size="17">5 V + GND from distribution</text>
<rect x="1110" y="690" width="345" height="105" rx="9" fill="white" stroke="#54758a" stroke-width="2"/>
<text x="1124" y="720" font-size="22">Servo 3 • ring + little</text>
<text x="1124" y="749" font-size="17">D11 → signal (220 Ω series)</text>
<text x="1124" y="773" font-size="17">5 V + GND from distribution</text>
<polyline points="700,635 850,635 850,472 1110,472" fill="none" stroke="#8b62b5" stroke-width="3"/>
<polyline points="700,660 930,660 930,607 1110,607" fill="none" stroke="#8b62b5" stroke-width="3"/>
<polyline points="700,685 850,685 850,742 1110,742" fill="none" stroke="#8b62b5" stroke-width="3"/>
<polyline points="60,835 1440,835" fill="none" stroke="#263b48" stroke-width="5"/>
<circle cx="185" cy="835" r="6" fill="#263b48"/>
<circle cx="525" cy="835" r="6" fill="#263b48"/>
<circle cx="885" cy="835" r="6" fill="#263b48"/>
<circle cx="1250" cy="835" r="6" fill="#263b48"/>
<text x="60" y="818" font-size="18">COMMON GND / STAR RETURN</text>
<text x="60" y="872" font-size="19">Battery −, both regulator GNDs, Nano GND, sensor − and servo returns join this net.</text>
<text x="60" y="901" font-size="18">Run servo-current return directly to distribution/star; keep it out of the sensor/Nano ground lead.</text>
<text x="40" y="952" font-size="18">ARM switch: open = disarmed; closed to GND = armed. This is not a mechanical emergency release.</text>
<text x="40" y="981" font-size="18">Disconnect external logic power and electrodes before USB programming. For body-connected testing, use battery only.</text>
<text x="40" y="1010" font-size="18">No charging or mains-connected USB while electrodes are worn. Check connector labels; wire colours can vary.</text>
</svg>